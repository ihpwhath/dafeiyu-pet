name: Release

# 打 tag（如 v1.4.8）即自动出完整版 + Lite 版安装包并创建 Release。
# 版本号请先改 package.json，再打同名 tag；tag 与 package.json 不一致会直接失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 安装 NSIS 与 Python 依赖
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # 必须用同一个 python 装 Pillow，否则 build-lite-assets.py 可能落到没有 Pillow 的解释器
          python -m pip install --upgrade pip pillow
          python -c "import PIL, sys; print('python', sys.executable); print('pillow', PIL.__version__)"

      - name: 确认 ffmpeg 与 libvpx-vp9 编码器
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          $enc = ffmpeg -hide_banner -encoders 2>&1 | Select-String -Pattern "libvpx-vp9"
          if (-not $enc) { Write-Error "ffmpeg 缺少 libvpx-vp9，Lite 素材无法压缩"; exit 1 }
          $enc

      - name: 校验 tag 与版本号
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) {
            Write-Error "tag $tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "发布版本：$tag"

      - name: 构建完整版
        run: npm run build

      # Lite 依赖 ffmpeg 的 VP9 编码，环境差异会导致失败；
      # 不让它阻断完整版的发布，失败时 Release 里就只挂完整版
      - name: 构建 Lite 版
        id: lite
        continue-on-error: true
        run: npm run build:lite

      - name: Lite 构建结果
        shell: pwsh
        run: |
          if ("${{ steps.lite.outcome }}" -ne "success") {
            Write-Warning "Lite 版构建失败（完整版不受影响，仍会发布）"
          }

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: false

name: Release

# 打 tag（如 v1.4.8）即自动出完整版 + Lite 版安装包并创建 Release。
# 版本号请先改 package.json，再打同名 tag；tag 与 package.json 不一致会直接失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: 安装 NSIS 与 Python 依赖
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          pip install pillow

      - name: 确认 ffmpeg（Lite 素材压缩需要）
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: 校验 tag 与版本号
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($pkg -ne $tag) {
            Write-Error "tag $tag 与 package.json 版本 $pkg 不一致"
            exit 1
          }
          Write-Host "发布版本：$tag"

      - name: 构建完整版
        run: npm run build

      - name: 构建 Lite 版
        run: npm run build:lite

      - name: 列出产物
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
